  <!-- LIGHTBOX MODAL (ZOOM + FADE TRANSITION FOR NEXT/PREV) -->
  <div id="lightbox-modal" class="lightbox-modal" aria-hidden="true">
    <div class="lightbox-backdrop"></div>
    <div class="lightbox-content">
      <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Foto Sebelumnya" title="Kenangan Sebelumnya">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="lightbox-body" id="lightbox-body">
        <div class="lightbox-polaroid glass-card-modal">
          <!-- Full-Bleed Photo Frame Container -->
          <div class="lightbox-img-wrap" id="lightbox-img-wrap">
            <!-- Smooth Sliding Track for Multi-Photos -->
            <div class="lightbox-carousel-track" id="lightbox-carousel-track">
              <div class="lightbox-carousel-slide active">
                <img id="lightbox-img" src="" alt="Detail Foto Lightbox">
              </div>
            </div>

            <!-- Toast-like Brief Info Hint (Fades out automatically) -->
            <span class="lightbox-zoom-hint" id="lightbox-peek-hint"><i class="fa-solid fa-hand-pointer"></i> Klik foto sembunyikan/tampilkan info</span>

            <!-- Multi-Photo Sub Nav Controls (Instagram-like) -->
            <button type="button" class="lightbox-sub-nav lightbox-sub-prev" id="lightbox-sub-prev" aria-label="Foto Sebelumnya" title="Foto Sebelumnya">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button type="button" class="lightbox-sub-nav lightbox-sub-next" id="lightbox-sub-next" aria-label="Foto Selanjutnya" title="Foto Selanjutnya">
              <i class="fa-solid fa-chevron-right"></i>
            </button>
          </div>

          <!-- Top Floating Bar (Category Tag + Header Dots + Close X Button) -->
          <div class="lightbox-top-bar">
            <span class="lightbox-tag" id="lightbox-tag">Kencan</span>
            <!-- Pagination Dots placed in header bar: clean, stylish & never covers photo! -->
            <div class="lightbox-sub-dots" id="lightbox-sub-dots"></div>
            <button class="lightbox-close" id="lightbox-close" aria-label="Tutup Lightbox" title="Tutup (Esc)">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>

          <!-- Bottom Frosted Glass Sheet (Ref: Gambar 2 Sophie Bennett) -->
          <div class="lightbox-details">
            <span class="lightbox-date" id="lightbox-date"></span>
            <h3 class="lightbox-title" id="lightbox-title"></h3>
            <p class="lightbox-caption" id="lightbox-caption"></p>
            <div class="lightbox-action-bar">
              <div class="lightbox-btn-group">
                <button type="button" id="btn-edit-lightbox" class="btn btn-sm btn-glass" title="Edit Detail Momen">
                  <i class="fa-solid fa-pen-to-square"></i> Edit
                </button>
                <button type="button" id="btn-toggle-featured-lightbox" class="btn btn-sm btn-glass"
                  title="Tampilkan / Sembunyikan dari Timeline">
                  <i class="fa-solid fa-heart"></i> <span id="featured-btn-text">Di Timeline</span>
                </button>
                <button type="button" id="btn-delete-lightbox" class="btn btn-sm btn-glass btn-delete-danger"
                  title="Hapus Foto Kenangan ini">
                  <i class="fa-solid fa-trash-can"></i> Hapus
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Foto Selanjutnya" title="Kenangan Selanjutnya">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
  </div>
